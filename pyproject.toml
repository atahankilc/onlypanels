[project]
name = "reonic-engine"
version = "0.1.0"
description = "Learns installer design decisions and proposes PV, battery and heat pump systems."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.1",
    "numpy",
    "pandas",
    "scikit-learn",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine/src/reonic_engine"]

[tool.pytest.ini_options]
testpaths = ["engine/tests"]
